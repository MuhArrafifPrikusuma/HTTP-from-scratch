name: Auto test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: build test bin
        uses: zig build test --summary all
